    - characters: [mommy, daddy, lily]
      image_prompt: Messy kitchen in warm light. The mom laughs while wiping sauce off the little girl's cheek. The dad shakes his head smiling. The little girl grins showing her two front teeth, a noodle on her head. Warm family close-up.
      action: slow zoom out
