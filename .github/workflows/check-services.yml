name: Check free services

on: workflow_dispatch

permissions:
  contents: read
  models: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements-free.txt
      - run: python check_services.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
