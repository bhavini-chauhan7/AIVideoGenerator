name: Check free animation services

on: workflow_dispatch

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements-free.txt
      - run: python check_video_spaces.py "$(ls videos/*/scene_01.jpg | tail -1)"
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
