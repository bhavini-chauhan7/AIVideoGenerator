name: Make a motivational post (free)

on:
  workflow_dispatch:
    inputs:
      theme:
        description: "Theme in a few words, e.g. 'never give up' (leave empty for the next ready-made post)"
        required: false
        default: ""
      slides:
        description: "How many quote slides (only used for your own theme)"
        required: false
        default: "8"

permissions:
  contents: write   # to save the finished post into the posts/ folder

concurrency:
  group: make-post
  cancel-in-progress: false

jobs:
  # 1) Write the post (ready-made, or by Claude / a free AI running on this computer)
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      chunks: ${{ steps.plan.outputs.chunks }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        env:
          THEME: ${{ inputs.theme }}
        run: |
          pip install -q requests PyYAML Pillow anthropic
          if [ -n "$THEME" ]; then
            pip install -q torch --index-url https://download.pytorch.org/whl/cpu
            pip install -q transformers
          fi
      - name: Remember the free writing AI between runs
        if: ${{ inputs.theme != '' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-qwen2.5-3b-instruct
      - name: Write the post
        id: plan
        env:
          THEME: ${{ inputs.theme }}
          SLIDES: ${{ inputs.slides }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python post_agent.py --plan-only work/post.json --slides "${SLIDES:-8}" --out posts -- "$THEME"
      - uses: actions/upload-artifact@v4
        with:
          name: post-plan
          path: work/post.json

  # 2) A few pictures per computer, so each gets its own free picture allowance
  pictures:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJSON(needs.plan.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: pip install -q requests PyYAML Pillow gradio_client
      - uses: actions/download-artifact@v4
        with:
          name: post-plan
          path: work
      - name: Draw pictures (group ${{ matrix.chunk }})
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python post_agent.py --chunk ${{ matrix.chunk }} --plan work/post.json --work work/pictures
      - uses: actions/upload-artifact@v4
        with:
          name: pictures-${{ matrix.chunk }}
          path: work/pictures/*.png

  # 3) Lay out the slides, make the reel and save everything
  finish:
    needs: pictures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q requests PyYAML Pillow
      - uses: actions/download-artifact@v4
        with:
          name: post-plan
          path: work
      - uses: actions/download-artifact@v4
        with:
          pattern: pictures-*
          merge-multiple: true
          path: work/pictures
      - name: Lay out the slides
        id: make
        run: python post_agent.py --finish --plan work/post.json --work work/pictures --out posts
      - uses: actions/upload-artifact@v4
        with:
          name: post
          path: ${{ steps.make.outputs.folder }}
      - name: Save post to the repo (posts/ folder)
        run: |
          git config user.name "post-agent"
          git config user.email "post-agent@users.noreply.github.com"
          git add posts
          git commit -m "New post: ${{ steps.make.outputs.folder }}"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
      - name: Summary
        run: |
          echo "## Your post is ready ✨" >> "$GITHUB_STEP_SUMMARY"
          echo "Open the **${{ steps.make.outputs.folder }}** folder in the repo. Post slide_01.png, slide_02.png ... as one carousel (or reel.mp4 as a Reel)." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat "${{ steps.make.outputs.folder }}/caption.txt" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
